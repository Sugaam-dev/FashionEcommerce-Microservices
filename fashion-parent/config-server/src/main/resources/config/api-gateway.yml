server:
  port: ${GATEWAY_PORT:8088}

spring:
  cloud:
    gateway:
      # ── Service Routes ────────────────────────────────────────────────────────
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/account/**, /api/v1/admin/users/**, /api/v1/internal/users/**

        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/categories/**, /api/v1/brands/**, /api/v1/products/**, /api/v1/admin/products/**, /api/v1/admin/categories/**, /api/v1/admin/brands/**, /api/v1/internal/catalog/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/cart/**, /api/v1/wishlist/**, /api/v1/orders/**, /api/v1/admin/orders/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**, /api/v1/admin/payments/**

        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/api/v1/coupons/**

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**, /api/v1/admin/inventory/**

# ── JWT & Security ────────────────────────────────────────────────────────────
app:
  jwt:
    secret-key: ${APP_JWT_SECRET:${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLWtleS1mb3ItaHM1MTItYWxnb3JpdGhtLWluLXByb2R1Y3Rpb24tbXVzdC1iZS02NC1ieXRlcy1vci1tb3Jl}}
    internal-service-key: ${APP_INTERNAL_SERVICE_KEY:${INTERNAL_SERVICE_KEY:pmrg-internal-secret-key-change-in-production}}

# ── CORS ─────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

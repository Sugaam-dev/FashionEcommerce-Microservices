spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: WARN
    com.pmrgsolution: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

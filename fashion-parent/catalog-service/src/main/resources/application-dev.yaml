spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.pmrgsolution: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

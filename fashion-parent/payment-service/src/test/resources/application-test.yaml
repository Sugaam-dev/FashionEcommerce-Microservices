spring:
  application:
    name: payment-service-test
  datasource:
    url: jdbc:h2:mem:payment_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

eureka:
  client:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

razorpay:
  key-id: rzp_test_mock_id
  key-secret: rzp_test_mock_secret_key_1234567890

app:
  defaults:
    currency: INR
  jwt:
    secret: test-secret-key-must-be-at-least-64-characters-long-for-hs512-algorithm-testing-purposes-only-123456789
    issuer: com.pmrgsolution
    cookie-name: app-jwt
  internal:
    service-key: test-internal-service-key

logging:
  level:
    com.pmrgsolution: DEBUG

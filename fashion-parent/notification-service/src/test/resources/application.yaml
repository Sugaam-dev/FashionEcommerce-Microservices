server:
  port: 0

spring:
  application:
    name: notification-service-test
  datasource:
    url: jdbc:h2:mem:notification_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 2525
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  health:
    mail:
      enabled: false

app:
  mail:
    from: test@fashionecommerce.com
    from-name: Fashion E-Commerce Test
    daily-limit: 3000
  admin:
    notification-email: admin@fashionecommerce.com
  cors:
    allowed-origins: http://localhost:3000
  internal-service-key: test-internal-service-key-2026

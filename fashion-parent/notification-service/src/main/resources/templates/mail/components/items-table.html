<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="itemsTable(items)">
    <table class="styled-table">
        <thead>
        <tr>
            <th>Item</th>
            <th style="text-align: center;">Qty</th>
            <th style="text-align: right;">Price</th>
            <th style="text-align: right;">Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.productName != null ? item.productName : item['productName']}">Product Name</td>
            <td style="text-align: center;" th:text="${item.quantity != null ? item.quantity : item['quantity']}">1</td>
            <td style="text-align: right;" th:text="'₹' + ${item.unitPrice != null ? item.unitPrice : item['unitPrice']}">₹0.00</td>
            <td style="text-align: right;" th:text="'₹' + ${item.totalPrice != null ? item.totalPrice : item['totalPrice']}">₹0.00</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout/base-layout :: layout(~{::#content})}">
<head>
    <meta charset="UTF-8">
    <title>Manual Payment Review Required</title>
</head>
<body>
<div id="content">
    <h2>⚠️ Manual Payment Proof Submitted</h2>
    <p>A customer has uploaded manual payment proof requiring admin verification.</p>

    <div style="background-color: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 16px; margin: 16px 0;">
        <p style="margin: 0 0 6px 0;"><strong>Order:</strong> <span th:text="'#' + ${orderNumber}">#ORD-12345</span></p>
        <p style="margin: 0 0 6px 0;"><strong>Customer:</strong> <span th:text="${customerName}">Customer Name</span></p>
        <p style="margin: 0 0 6px 0;"><strong>Amount:</strong> <span th:text="'₹' + ${amount}">₹0.00</span></p>
        <p style="margin: 0;"><strong>UTR / Reference Number:</strong> <span th:text="${utrNumber}">UTR1234567890</span></p>
    </div>

    <p>Please check your bank statement and approve or reject the payment in the admin portal.</p>
</div>
</body>
</html>

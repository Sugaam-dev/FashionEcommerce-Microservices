<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout/base-layout :: layout(~{::#content})}">
<head>
    <meta charset="UTF-8">
    <title>Order Cancelled</title>
</head>
<body>
<div id="content">
    <h2>Order Cancelled: <span th:text="'#' + ${orderNumber}">#ORD-12345</span></h2>
    <p>Hello <strong th:text="${firstName != null ? firstName : (name != null ? name : 'Valued Customer')}">Customer</strong>,</p>
    <p>Your order <strong th:text="'#' + ${orderNumber}">#ORD-12345</strong> has been cancelled.</p>
    
    <p th:if="${cancellationReason != null}">
        <strong>Reason for cancellation:</strong> <span th:text="${cancellationReason}">Customer Request</span>
    </p>

    <p>If you have already made a payment, a full refund will be processed back to your original payment method within 3–5 business days.</p>
</div>
</body>
</html>

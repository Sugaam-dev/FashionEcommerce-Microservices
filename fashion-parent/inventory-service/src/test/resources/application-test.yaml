spring:
  application:
    name: inventory-service-test
  datasource:
    url: jdbc:h2:mem:inventory_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false
  data:
    redis:
      repositories:
        enabled: false

eureka:
  client:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret-key: test-secret-key-must-be-at-least-64-characters-long-for-hs512-algorithm-testing-purposes-only-123456789
  internal:
    service-key: test-internal-service-key

logging:
  level:
    com.pmrgsolution: DEBUG

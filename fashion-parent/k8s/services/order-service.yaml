apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: order-service
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: order-service
          image: ${REGISTRY}/order-service:${TAG:-latest}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: spring-profiles-active
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: db-host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: db-port
            - name: ORDER_DB_NAME
              value: "order_db"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: db-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: redis-host
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: kafka-bootstrap-servers
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: jwt-secret
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: global-secrets
                  key: internal-service-key
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service.ecommerce.svc.cluster.local:8087"
            - name: COUPON_SERVICE_URL
              value: "http://coupon-service.ecommerce.svc.cluster.local:8085"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.ecommerce.svc.cluster.local:8081"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service.ecommerce.svc.cluster.local:8082"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  selector:
    app: order-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

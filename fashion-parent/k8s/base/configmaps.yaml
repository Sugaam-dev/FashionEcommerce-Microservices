apiVersion: v1
kind: ConfigMap
metadata:
  name: global-config
  namespace: ecommerce
data:
  spring-profiles-active: "prod"
  kafka-bootstrap-servers: "kafka.ecommerce.svc.cluster.local:9092"
  redis-host: "redis.ecommerce.svc.cluster.local"
  redis-port: "6379"
  db-host: "postgres.ecommerce.svc.cluster.local"
  db-port: "5432"
  cors-allowed-origins: "https://fashionstore.com,https://admin.fashionstore.com"
  default-currency: "INR"
